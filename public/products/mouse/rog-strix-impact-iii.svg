<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-impact" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10b981" flood-opacity="0.22" />
    </filter>
    <linearGradient id="body-grad-impact" x1="180" y1="80" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2c34" />
      <stop offset="45%" stop-color="#17181e" />
      <stop offset="100%" stop-color="#0b0c0f" />
    </linearGradient>
    <linearGradient id="wheel-glow-impact" x1="300" y1="130" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="rog-glow-impact" x1="260" y1="390" x2="340" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-impact)">
    <!-- Compact Ambidextrous Silhouette -->
    <path d="M 300 85 C 242 85 194 135 184 220 C 176 280 172 355 186 435 C 200 498 245 522 300 522 C 355 522 400 498 414 435 C 428 355 424 280 416 220 C 406 135 358 85 300 85 Z" fill="url(#body-grad-impact)" stroke="#3b3f4d" stroke-width="1.8" />

    <!-- Left & Right Micro Texture Grips -->
    <path d="M 184 220 C 176 280 174 345 186 425 C 192 390 196 325 195 255 Z" fill="#121418" opacity="0.8" />
    <path d="M 416 220 C 424 280 426 345 414 425 C 408 390 404 325 405 255 Z" fill="#121418" opacity="0.8" />

    <!-- Side Buttons (Left Side Fast Trigger) -->
    <path d="M 174 265 C 173 252 180 248 186 248 L 190 280 C 183 280 175 278 174 265 Z" fill="#090a0d" stroke="#10b981" stroke-width="1.2" />
    <path d="M 176 290 C 175 282 181 280 188 280 L 192 312 C 185 312 177 308 176 290 Z" fill="#090a0d" stroke="#10b981" stroke-width="1.2" />

    <!-- Left & Right Pivot Triggers -->
    <path d="M 294 95 C 245 96 208 138 200 215 C 198 235 199 252 201 266 L 294 266 Z" fill="#24262f" stroke="#3e4352" stroke-width="1.2" />
    <path d="M 306 95 C 355 96 392 138 400 215 C 402 235 401 252 399 266 L 306 266 Z" fill="#24262f" stroke="#3e4352" stroke-width="1.2" />

    <!-- Center Separation Groove -->
    <rect x="296" y="92" width="8" height="180" rx="4" fill="#090a0d" />
    <rect x="288" y="132" width="24" height="85" rx="12" fill="#0f1014" stroke="#2b2e38" stroke-width="1.5" />

    <!-- Scroll Wheel -->
    <rect x="292" y="138" width="16" height="72" rx="8" fill="#14161c" stroke="url(#wheel-glow-impact)" stroke-width="1.8" />
    <line x1="294" y1="148" x2="306" y2="148" stroke="#34d399" stroke-width="1.8" />
    <line x1="294" y1="158" x2="306" y2="158" stroke="#34d399" stroke-width="1.8" />
    <line x1="294" y1="168" x2="306" y2="168" stroke="#34d399" stroke-width="1.8" />
    <line x1="294" y1="178" x2="306" y2="178" stroke="#34d399" stroke-width="1.8" />
    <line x1="294" y1="188" x2="306" y2="188" stroke="#34d399" stroke-width="1.8" />
    <line x1="294" y1="198" x2="306" y2="198" stroke="#34d399" stroke-width="1.8" />

    <!-- DPI Button -->
    <rect x="294" y="224" width="12" height="18" rx="4" fill="#1c1f26" stroke="#343845" stroke-width="1.2" />
    <circle cx="300" cy="233" r="2" fill="#10b981" />

    <!-- ROG Fearless Eye Emblem -->
    <g transform="translate(255, 395) scale(0.9)">
      <!-- Left Eye Wing -->
      <path d="M 8 36 L 42 16 L 38 24 L 18 36 Z" fill="url(#rog-glow-impact)" />
      <!-- Right Eye Wing / Pupil Slash -->
      <path d="M 45 15 L 94 36 L 90 42 L 56 22 L 54 38 L 48 38 Z" fill="url(#rog-glow-impact)" />
      <!-- Bottom Angular Fangs -->
      <path d="M 24 42 L 40 54 L 34 56 L 20 44 Z" fill="url(#rog-glow-impact)" />
      <path d="M 76 42 L 60 54 L 66 56 L 80 44 Z" fill="url(#rog-glow-impact)" />
    </g>

    <text x="300" y="488" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">STRIX IMPACT III</text>
  </g>
</svg>
