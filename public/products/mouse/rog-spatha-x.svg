<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-spatha" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.22" />
    </filter>
    <linearGradient id="body-grad-spatha" x1="140" y1="80" x2="450" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32343d" />
      <stop offset="50%" stop-color="#1c1e24" />
      <stop offset="100%" stop-color="#0e0f14" />
    </linearGradient>
    <linearGradient id="magnesium-accent" x1="130" y1="200" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b7280" />
      <stop offset="50%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <linearGradient id="wheel-glow-spatha" x1="300" y1="130" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rog-glow-spatha" x1="260" y1="390" x2="340" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-spatha)">
    <!-- Magnesium Base Flanges Left & Right (Aggressive MMO Wings) -->
    <path d="M 170 210 L 130 250 L 138 380 L 175 450 Z" fill="url(#magnesium-accent)" stroke="#4b5563" stroke-width="1.6" />
    <path d="M 430 210 L 470 250 L 462 380 L 425 450 Z" fill="url(#magnesium-accent)" stroke="#4b5563" stroke-width="1.6" />

    <!-- 6 Thumb Buttons Matrix (Iconic Eye Shape Array) -->
    <polygon points="144,260 160,250 160,275 144,282" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />
    <polygon points="144,286 160,279 160,305 144,312" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />
    <polygon points="144,316 160,309 160,335 144,342" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />
    <polygon points="164,250 178,245 178,272 164,275" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />
    <polygon points="164,279 178,276 178,302 164,305" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />
    <polygon points="164,309 178,306 178,332 164,335" fill="#111827" stroke="#f59e0b" stroke-width="1.3" />

    <!-- Angular Heavy Hull Silhouette -->
    <path d="M 295 72 L 230 78 L 180 140 L 165 240 L 174 445 L 235 528 L 355 528 L 420 445 L 432 240 L 418 140 L 360 78 Z" fill="url(#body-grad-spatha)" stroke="#4b5563" stroke-width="2" />

    <!-- Angular Click Triggers -->
    <path d="M 290 82 L 236 88 L 194 148 L 184 250 L 290 262 Z" fill="#242730" stroke="#4b5563" stroke-width="1.3" />
    <path d="M 306 82 L 360 88 L 402 148 L 412 250 L 306 262 Z" fill="#242730" stroke="#4b5563" stroke-width="1.3" />

    <!-- Center Separation Groove -->
    <rect x="294" y="78" width="8" height="190" rx="4" fill="#0b0c10" />
    <rect x="286" y="126" width="24" height="85" rx="12" fill="#111318" stroke="#374151" stroke-width="1.5" />

    <!-- Heavy Machined Scroll Wheel -->
    <rect x="290" y="132" width="16" height="72" rx="8" fill="#181a22" stroke="url(#wheel-glow-spatha)" stroke-width="1.8" />
    <line x1="292" y1="142" x2="304" y2="142" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="292" y1="152" x2="304" y2="152" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="292" y1="162" x2="304" y2="162" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="292" y1="172" x2="304" y2="172" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="292" y1="182" x2="304" y2="182" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="292" y1="192" x2="304" y2="192" stroke="#fbbf24" stroke-width="1.8" />

    <!-- Angular Profile Button -->
    <rect x="292" y="220" width="12" height="18" rx="4" fill="#1f222b" stroke="#4b5563" stroke-width="1.2" />
    <circle cx="298" cy="229" r="2" fill="#f59e0b" />

    <!-- ROG Fearless Eye Emblem -->
    <g transform="translate(254, 390) scale(0.95)">
      <!-- Left Eye Wing -->
      <path d="M 8 36 L 42 16 L 38 24 L 18 36 Z" fill="url(#rog-glow-spatha)" />
      <!-- Right Eye Wing / Pupil Slash -->
      <path d="M 45 15 L 94 36 L 90 42 L 56 22 L 54 38 L 48 38 Z" fill="url(#rog-glow-spatha)" />
      <!-- Bottom Angular Fangs -->
      <path d="M 24 42 L 40 54 L 34 56 L 20 44 Z" fill="url(#rog-glow-spatha)" />
      <path d="M 76 42 L 60 54 L 66 56 L 80 44 Z" fill="url(#rog-glow-spatha)" />
    </g>

    <text x="298" y="490" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">12 BUTTON MMO BEAST</text>
  </g>
</svg>
