<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-chakram" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.22" />
    </filter>
    <linearGradient id="body-grad-chakram" x1="150" y1="80" x2="430" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e3038" />
      <stop offset="45%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
    <linearGradient id="thumb-wing-chakram" x1="120" y1="240" x2="200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22252c" />
      <stop offset="100%" stop-color="#101115" />
    </linearGradient>
    <linearGradient id="wheel-glow-chakram" x1="300" y1="130" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="rog-glow-chakram" x1="260" y1="390" x2="340" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="joystick-grad" x1="135" y1="285" x2="165" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c5162" />
      <stop offset="50%" stop-color="#272b35" />
      <stop offset="100%" stop-color="#14161b" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-chakram)">
    <!-- Broad Flared Thumb Wing (Chakram Iconic Signature) -->
    <path d="M 195 210 C 145 220 120 270 122 345 C 124 415 165 465 195 475 Z" fill="url(#thumb-wing-chakram)" stroke="#3e4350" stroke-width="1.5" />

    <!-- Analog Joystick Base & Stick -->
    <circle cx="152" cy="305" r="18" fill="#0d0e12" stroke="#6b21a8" stroke-width="1.8" />
    <circle cx="152" cy="305" r="11" fill="url(#joystick-grad)" stroke="#a855f7" stroke-width="1.4" />
    <line x1="147" y1="305" x2="157" y2="305" stroke="#c084fc" stroke-width="1.4" />
    <line x1="152" y1="300" x2="152" y2="310" stroke="#c084fc" stroke-width="1.4" />

    <!-- Main Chassis Silhouette -->
    <path d="M 295 75 C 235 76 182 125 174 215 C 168 280 170 365 186 442 C 205 510 255 528 308 528 C 368 528 418 505 432 435 C 448 355 438 275 424 210 C 410 128 358 74 295 75 Z" fill="url(#body-grad-chakram)" stroke="#3f4553" stroke-width="1.8" />

    <!-- Front Aura Lightbar Lip -->
    <path d="M 220 78 C 265 70 330 70 375 78 L 380 84 C 330 76 265 76 215 84 Z" fill="#a855f7" opacity="0.85" />

    <!-- Left & Right Click Triggers -->
    <path d="M 288 84 C 238 88 196 132 188 215 C 186 235 187 252 190 268 L 288 268 Z" fill="#252831" stroke="#424755" stroke-width="1.2" />
    <path d="M 302 84 C 352 88 394 132 402 215 C 404 235 403 252 400 268 L 302 268 Z" fill="#252831" stroke="#424755" stroke-width="1.2" />

    <!-- Center Separation Groove -->
    <rect x="292" y="80" width="8" height="190" rx="4" fill="#090a0d" />
    <rect x="284" y="128" width="24" height="85" rx="12" fill="#0f1115" stroke="#2c303c" stroke-width="1.5" />

    <!-- Scroll Wheel with Tactile Tread -->
    <rect x="288" y="134" width="16" height="72" rx="8" fill="#15171d" stroke="url(#wheel-glow-chakram)" stroke-width="1.8" />
    <line x1="290" y1="144" x2="302" y2="144" stroke="#c084fc" stroke-width="1.8" />
    <line x1="290" y1="154" x2="302" y2="154" stroke="#c084fc" stroke-width="1.8" />
    <line x1="290" y1="164" x2="302" y2="164" stroke="#c084fc" stroke-width="1.8" />
    <line x1="290" y1="174" x2="302" y2="174" stroke="#c084fc" stroke-width="1.8" />
    <line x1="290" y1="184" x2="302" y2="184" stroke="#c084fc" stroke-width="1.8" />
    <line x1="290" y1="194" x2="302" y2="194" stroke="#c084fc" stroke-width="1.8" />

    <!-- DPI Cycle Button -->
    <rect x="290" y="222" width="12" height="18" rx="4" fill="#1d2027" stroke="#363b48" stroke-width="1.2" />
    <circle cx="296" cy="231" r="2" fill="#a855f7" />

    <!-- Palm Badge ROG Logo -->
    <g transform="translate(258, 395) scale(0.92)">
      <!-- Left Eye Wing -->
      <path d="M 8 36 L 42 16 L 38 24 L 18 36 Z" fill="url(#rog-glow-chakram)" />
      <!-- Right Eye Wing / Pupil Slash -->
      <path d="M 45 15 L 94 36 L 90 42 L 56 22 L 54 38 L 48 38 Z" fill="url(#rog-glow-chakram)" />
      <!-- Bottom Angular Fangs -->
      <path d="M 24 42 L 40 54 L 34 56 L 20 44 Z" fill="url(#rog-glow-chakram)" />
      <path d="M 76 42 L 60 54 L 66 56 L 80 44 Z" fill="url(#rog-glow-chakram)" />
    </g>

    <text x="302" y="490" text-anchor="middle" fill="#6a7487" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">JOYSTICK ORIGIN</text>
  </g>
</svg>
