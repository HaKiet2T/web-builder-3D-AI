<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-harpe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ff0033" flood-opacity="0.2" />
    </filter>
    <linearGradient id="body-grad-harpe" x1="180" y1="80" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2d34" />
      <stop offset="45%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>
    <linearGradient id="btn-left-harpe" x1="180" y1="100" x2="295" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32363f" />
      <stop offset="100%" stop-color="#1b1d22" />
    </linearGradient>
    <linearGradient id="btn-right-harpe" x1="420" y1="100" x2="305" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32363f" />
      <stop offset="100%" stop-color="#1b1d22" />
    </linearGradient>
    <linearGradient id="wheel-glow-harpe" x1="300" y1="130" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <linearGradient id="rog-glow-harpe" x1="260" y1="390" x2="340" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="60%" stop-color="#e60026" />
      <stop offset="100%" stop-color="#800010" />
    </linearGradient>
    <linearGradient id="side-grip-harpe" x1="150" y1="200" x2="210" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15171b" />
      <stop offset="100%" stop-color="#0d0e11" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-harpe)">
    <!-- Main Mouse Silhouette (Symmetrical Esports Profile) -->
    <path d="M 300 80 C 235 80 185 130 175 220 C 168 285 162 360 178 440 C 192 505 240 525 300 525 C 360 525 408 505 422 440 C 438 360 432 285 425 220 C 415 130 365 80 300 80 Z" fill="url(#body-grad-harpe)" stroke="#3b404d" stroke-width="1.8" />

    <!-- Left Side Grip & Thumb Contour -->
    <path d="M 175 220 C 168 285 164 340 178 430 C 185 390 190 320 188 250 C 187 230 182 222 175 220 Z" fill="url(#side-grip-harpe)" opacity="0.85" />
    <!-- Grip Micro Texture Lines Left -->
    <path d="M 175 270 L 186 280 M 174 290 L 186 300 M 173 310 L 186 320 M 173 330 L 186 340 M 174 350 L 186 360 M 176 370 L 187 380" stroke="#252930" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Side Grip & Ring Finger Contour -->
    <path d="M 425 220 C 432 285 436 340 422 430 C 415 390 410 320 412 250 C 413 230 418 222 425 220 Z" fill="url(#side-grip-harpe)" opacity="0.85" />
    <!-- Grip Micro Texture Lines Right -->
    <path d="M 425 270 L 414 280 M 426 290 L 414 300 M 427 310 L 414 320 M 427 330 L 414 340 M 426 350 L 414 360 M 424 370 L 413 380" stroke="#252930" stroke-width="1.5" stroke-linecap="round" />

    <!-- Thumb Buttons (Esports Fast Click) -->
    <path d="M 166 265 C 165 250 172 245 178 245 L 183 280 C 176 280 167 278 166 265 Z" fill="#0b0c0e" stroke="#00f0ff" stroke-width="1.2" />
    <path d="M 168 290 C 167 282 173 280 182 280 L 185 315 C 177 315 169 310 168 290 Z" fill="#0b0c0e" stroke="#00f0ff" stroke-width="1.2" />

    <!-- Left Click Button -->
    <path d="M 294 92 C 240 93 200 135 192 215 C 190 235 191 255 193 268 L 294 268 Z" fill="url(#btn-left-harpe)" stroke="#3d424e" stroke-width="1.2" />

    <!-- Right Click Button -->
    <path d="M 306 92 C 360 93 400 135 408 215 C 410 235 409 255 407 268 L 306 268 Z" fill="url(#btn-right-harpe)" stroke="#3d424e" stroke-width="1.2" />

    <!-- Center Separation Groove & Scroll Island -->
    <rect x="296" y="90" width="8" height="180" rx="4" fill="#0a0b0d" />
    <rect x="288" y="130" width="24" height="85" rx="12" fill="#0e1014" stroke="#2b2f38" stroke-width="1.5" />

    <!-- Scroll Wheel (Titanium Core + Rubber Tread + Cyber Glow) -->
    <rect x="292" y="136" width="16" height="72" rx="8" fill="#15171c" stroke="url(#wheel-glow-harpe)" stroke-width="1.8" />
    <!-- Scroll Wheel Ridges -->
    <line x1="294" y1="146" x2="306" y2="146" stroke="#00f0ff" stroke-width="1.8" />
    <line x1="294" y1="156" x2="306" y2="156" stroke="#00f0ff" stroke-width="1.8" />
    <line x1="294" y1="166" x2="306" y2="166" stroke="#00f0ff" stroke-width="1.8" />
    <line x1="294" y1="176" x2="306" y2="176" stroke="#00f0ff" stroke-width="1.8" />
    <line x1="294" y1="186" x2="306" y2="186" stroke="#00f0ff" stroke-width="1.8" />
    <line x1="294" y1="196" x2="306" y2="196" stroke="#00f0ff" stroke-width="1.8" />

    <!-- DPI Indicator Button Behind Wheel -->
    <rect x="294" y="224" width="12" height="18" rx="4" fill="#1f2229" stroke="#363b47" stroke-width="1.2" />
    <circle cx="300" cy="233" r="2" fill="#00f0ff" />

    <!-- Palm Arch Subtle Ridge Line -->
    <path d="M 210 330 C 255 315 345 315 390 330" stroke="#252932" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- ROG Fearless Eye Emblem (Glows on Palm) -->
    <g transform="translate(255, 395) scale(0.9)">
      <path d="M 0 35 C 10 18 35 15 50 15 C 65 15 90 20 100 35 C 90 55 55 60 50 60 C 45 60 10 55 0 35 Z" fill="none" />
      <!-- Left Eye Wing -->
      <path d="M 8 36 L 42 16 L 38 24 L 18 36 Z" fill="url(#rog-glow-harpe)" />
      <!-- Right Eye Wing / Pupil Slash -->
      <path d="M 45 15 L 94 36 L 90 42 L 56 22 L 54 38 L 48 38 Z" fill="url(#rog-glow-harpe)" />
      <!-- Bottom Angular Fangs -->
      <path d="M 24 42 L 40 54 L 34 56 L 20 44 Z" fill="url(#rog-glow-harpe)" />
      <path d="M 76 42 L 60 54 L 66 56 L 80 44 Z" fill="url(#rog-glow-harpe)" />
    </g>

    <!-- Aim Lab Edition Badge -->
    <text x="300" y="488" text-anchor="middle" fill="#586274" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5">AIM LAB EDITION</text>
  </g>
</svg>
