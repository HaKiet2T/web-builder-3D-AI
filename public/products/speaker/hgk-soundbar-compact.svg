<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-hgk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <linearGradient id="hgk-body" x1="60" y1="260" x2="540" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="50%" stop-color="#1e1e22" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="knob-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e727a" />
      <stop offset="50%" stop-color="#3c4048" />
      <stop offset="100%" stop-color="#1a1c20" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-hgk)">
    <!-- Low-profile Silicone Acoustic Feet -->
    <rect x="120" y="340" width="40" height="10" rx="3" fill="#141416" stroke="#2c2c30" stroke-width="1" />
    <rect x="440" y="340" width="40" height="10" rx="3" fill="#141416" stroke="#2c2c30" stroke-width="1" />

    <!-- Main Aluminum Soundbar Body -->
    <rect x="70" y="270" width="460" height="74" rx="14" fill="url(#hgk-body)" stroke="#3e3e44" stroke-width="1.6" />

    <!-- Seamless Front Anodized Mesh -->
    <rect x="85" y="280" width="400" height="54" rx="8" fill="#0d0d0f" stroke="#1f1f24" stroke-width="1" />
    
    <!-- Micro Acoustic Perforations Array -->
    <g stroke="#26262c" stroke-width="1" stroke-dasharray="2,3" opacity="0.6">
      <line x1="100" y1="292" x2="470" y2="292" />
      <line x1="100" y1="300" x2="470" y2="300" />
      <line x1="100" y1="308" x2="470" y2="308" />
      <line x1="100" y1="316" x2="470" y2="316" />
      <line x1="100" y1="324" x2="470" y2="324" />
    </g>

    <!-- Discreet Pure White Status LED (Active Indicator) -->
    <circle cx="285" cy="307" r="3" fill="#ffffff" />
    <circle cx="285" cy="307" r="6" fill="#ffffff" opacity="0.25" />

    <!-- Rotary Volume Endcap Knob (Right side) -->
    <rect x="495" y="279" width="22" height="56" rx="5" fill="url(#knob-grad)" stroke="#4a4e58" stroke-width="1.2" />
    <line x1="506" y1="288" x2="506" y2="326" stroke="#121316" stroke-width="2" />
    <line x1="510" y1="295" x2="510" y2="319" stroke="#8c92a0" stroke-width="1" opacity="0.7" />

    <!-- Subtle HGK Typography on top left -->
    <text x="100" y="265" font-size="9" font-weight="600" fill="#888892" letter-spacing="2" font-family="sans-serif">HGK COMPACT</text>
  </g>
</svg>
