<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-razer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00ff66" flood-opacity="0.25" />
    </filter>
    <linearGradient id="razer-chassis" x1="50" y1="240" x2="550" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a1c" />
      <stop offset="35%" stop-color="#24272a" />
      <stop offset="70%" stop-color="#141517" />
      <stop offset="100%" stop-color="#0e0f10" />
    </linearGradient>
    <linearGradient id="chroma-rgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="30%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#7928ca" />
      <stop offset="85%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-razer)">
    <!-- Angled Desk Feet -->
    <polygon points="120,335 180,335 190,365 110,365" fill="#121315" stroke="#222429" stroke-width="1.5" />
    <polygon points="420,335 480,335 490,365 410,365" fill="#121315" stroke="#222429" stroke-width="1.5" />

    <!-- Trapezoidal Prism Soundbar Chassis -->
    <polygon points="75,255 525,255 545,340 55,340" fill="url(#razer-chassis)" stroke="#2f333a" stroke-width="2" />

    <!-- Top Chamfer & Button Array -->
    <polygon points="95,245 505,245 525,255 75,255" fill="#1b1c20" stroke="#2a2c33" stroke-width="1" />
    <circle cx="280" cy="250" r="3" fill="#00ff66" />
    <circle cx="300" cy="250" r="3" fill="#444850" />
    <circle cx="320" cy="250" r="3" fill="#444850" />

    <!-- Micro-Mesh Front Grille -->
    <rect x="85" y="265" width="430" height="65" rx="5" fill="#0c0d0f" stroke="#1c1d22" stroke-width="1.5" />
    
    <!-- Twin Full-Range Drivers Behind Grille -->
    <circle cx="160" cy="297" r="26" fill="#14161a" stroke="#00ff66" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="160" cy="297" r="10" fill="#060708" />
    <circle cx="440" cy="297" r="26" fill="#14161a" stroke="#00ff66" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="440" cy="297" r="10" fill="#060708" />

    <!-- Passive Radiators (Dual Center Excursion) -->
    <rect x="230" y="280" width="60" height="34" rx="6" fill="#101114" stroke="#262830" stroke-width="1" />
    <rect x="310" y="280" width="60" height="34" rx="6" fill="#101114" stroke="#262830" stroke-width="1" />

    <!-- Razer Triple-Headed Snake Subtle Emblem -->
    <circle cx="300" cy="300" r="6" fill="#000000" stroke="#00ff66" stroke-width="1" />

    <!-- 14-Zone Razer Chroma Underglow Strip -->
    <rect x="65" y="338" width="470" height="6" rx="3" fill="url(#chroma-rgb)" opacity="0.9" />
    <ellipse cx="300" cy="346" rx="210" ry="10" fill="#00ff66" opacity="0.2" />
  </g>
</svg>
