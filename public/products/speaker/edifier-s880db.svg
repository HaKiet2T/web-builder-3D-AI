<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-edifier" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="wood-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b28c" />
      <stop offset="50%" stop-color="#b88d5e" />
      <stop offset="100%" stop-color="#8c6239" />
    </linearGradient>
    <linearGradient id="white-baffle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd" />
      <stop offset="100%" stop-color="#eceff1" />
    </linearGradient>
    <radialGradient id="titanium-tweeter" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a0aab2" />
      <stop offset="100%" stop-color="#4a525a" />
    </radialGradient>
    <radialGradient id="metal-woofer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54606e" />
      <stop offset="60%" stop-color="#242b33" />
      <stop offset="90%" stop-color="#121519" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </radialGradient>
  </defs>

  <g filter="url(#shadow-edifier)">
    <!-- LEFT SPEAKER -->
    <g transform="translate(60, 40)">
      <!-- Wood Side Cheeks -->
      <rect x="75" y="120" width="22" height="350" rx="4" fill="url(#wood-panel)" stroke="#7a5530" stroke-width="1.2" />
      <rect x="233" y="120" width="22" height="350" rx="4" fill="url(#wood-panel)" stroke="#7a5530" stroke-width="1.2" />
      
      <!-- Front White Satin Baffle -->
      <rect x="90" y="110" width="150" height="360" rx="6" fill="url(#white-baffle)" stroke="#cfd8dc" stroke-width="1.5" />

      <!-- 19mm Titanium Dome Tweeter with Horn Waveguide -->
      <circle cx="165" cy="190" r="34" fill="#1e2329" stroke="#90a4ae" stroke-width="1" />
      <circle cx="165" cy="190" r="22" fill="url(#titanium-tweeter)" stroke="#37474f" stroke-width="1.2" />
      <!-- Phase Bridge Bar -->
      <line x1="143" y1="190" x2="187" y2="190" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round" />

      <!-- 3.75" Metal Diaphragm Bass Unit -->
      <circle cx="165" cy="325" r="56" fill="#0d1013" stroke="#b0bec5" stroke-width="1.8" />
      <circle cx="165" cy="325" r="48" fill="url(#metal-woofer)" />
      <circle cx="165" cy="325" r="22" fill="#1a1f26" stroke="#cfd8dc" stroke-width="1" />
      <!-- High-precision rubber surround -->
      <circle cx="165" cy="325" r="52" stroke="#263238" stroke-width="4" fill="none" opacity="0.6" />

      <!-- Hi-Res Audio Golden Badge -->
      <rect x="145" y="420" width="40" height="24" rx="2" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
      <text x="165" y="433" font-size="7" font-weight="bold" fill="#d4af37" text-anchor="middle" font-family="sans-serif">Hi-Res</text>
      <text x="165" y="440" font-size="5" fill="#ffffff" text-anchor="middle" font-family="sans-serif">AUDIO</text>
    </g>

    <!-- RIGHT SPEAKER (Master unit with OLED status display) -->
    <g transform="translate(260, 40)">
      <!-- Wood Side Cheeks -->
      <rect x="75" y="120" width="22" height="350" rx="4" fill="url(#wood-panel)" stroke="#7a5530" stroke-width="1.2" />
      <rect x="233" y="120" width="22" height="350" rx="4" fill="url(#wood-panel)" stroke="#7a5530" stroke-width="1.2" />

      <!-- Front White Satin Baffle -->
      <rect x="90" y="110" width="150" height="360" rx="6" fill="url(#white-baffle)" stroke="#cfd8dc" stroke-width="1.5" />

      <!-- Titanium Dome Tweeter -->
      <circle cx="165" cy="190" r="34" fill="#1e2329" stroke="#90a4ae" stroke-width="1" />
      <circle cx="165" cy="190" r="22" fill="url(#titanium-tweeter)" stroke="#37474f" stroke-width="1.2" />
      <line x1="143" y1="190" x2="187" y2="190" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round" />

      <!-- Metal Diaphragm Bass Unit -->
      <circle cx="165" cy="325" r="56" fill="#0d1013" stroke="#b0bec5" stroke-width="1.8" />
      <circle cx="165" cy="325" r="48" fill="url(#metal-woofer)" />
      <circle cx="165" cy="325" r="22" fill="#1a1f26" stroke="#cfd8dc" stroke-width="1" />
      <circle cx="165" cy="325" r="52" stroke="#263238" stroke-width="4" fill="none" opacity="0.6" />

      <!-- Circular OLED Input Display -->
      <circle cx="165" cy="432" r="14" fill="#0a0a0c" stroke="#cfd8dc" stroke-width="1.2" />
      <text x="165" y="435" font-size="8" font-weight="bold" fill="#00e5ff" text-anchor="middle" font-family="monospace">USB</text>
    </g>
  </g>
</svg>
